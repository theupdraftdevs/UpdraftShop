name: Release

# Tag a release with `git tag v1.0.0 && git push --tags` and this publishes it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v1.0.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Stops the tag and the build drifting apart, which is how you end up shipping a
      # "v1.1.0" tag that reports itself as 1.0.0 in plugin.yml.
      - name: Check tag matches the build version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          expected="${tag#v}"
          actual="$(./gradlew -q properties --console=plain | sed -n 's/^version: //p')"

          echo "tag=$tag"
          echo "expected=$expected"
          echo "actual=$actual"

          if [ "$expected" != "$actual" ]; then
            echo "::error::Tag $tag does not match build.gradle.kts version $actual."
            exit 1
          fi

          echo "Version $actual matches the tag."

      - name: Build
        run: ./gradlew build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/libs/UpdraftShop-*.jar
            build/libs/UpdraftShop-*-sources.jar
          fail_on_unmatched_files: true