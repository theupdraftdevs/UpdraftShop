  not-enough-money: "&cYou need &f{price} &cto do that."
  inventory-full: "&cYou do not have room for that."
  nothing-to-sell: "&cYou do not have any &f{item} &cto sell."
  not-for-sale: "&cThat cannot be bought or sold here."
  economy-error: "&cThe economy provider rejected that transaction."
  unknown-item: "&cThat item is not in the shop."