# Updraft Shop
# Shop categories, items and prices.
# Colours use & codes (and #rrggbb hex), e.g. &a for green.
#
# Menus are styled after Hypixel: window titles are joined with a grey "»", category
# names are all caps, and prices read like "&a&lBUY &7- &a&l$500". Change any string
# here to reword the shop; nothing is hardcoded in the plugin.

# Prefix put in front of every chat message the plugin sends.
prefix: "&8&lUpdraft Shop &7» &r"

gui:
  # Used to build window titles: "&8Updraft Shop" and "&8Updraft Shop §7» §8ORES"
  shop-name: "Updraft Shop"
  # size must be 27 or 54
  main-size: 54
  # Play a soft click when navigating menus and completing trades
  sounds: true
  # Item shown in the bottom row of every category and trade view
  back-item: "&e&lBack"
  back-icon: ARROW
  close-item: "&c&lClose"
  close-icon: BARRIER

economy:
  # Used only when Vault is not installed. Balances are stored in economy.yml.
  starting-balance: 0.0
  currency-symbol: "$"

